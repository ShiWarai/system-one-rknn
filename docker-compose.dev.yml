# Только dev-контейнер для тестов. Прод-сервис сюда не входит.

name: system-one-rknn-dev

services:
  dev:
    image: system-one-rknn-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: system-one-rknn-dev
    user: "${RUNNER_UID:-0}:${RUNNER_GID:-0}"
    volumes:
      - .:/app
    working_dir: /app
