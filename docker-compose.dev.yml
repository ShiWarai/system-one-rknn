# Только dev-контейнер для тестов. Прод-сервис сюда не входит.

name: service-template-dev

services:
  dev:
    image: service-template-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: service-template-dev
    user: "${RUNNER_UID:-0}:${RUNNER_GID:-0}"
    volumes:
      - .:/app
    working_dir: /app
