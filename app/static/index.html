<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>system one</title>
  <style>
    :root { color-scheme: dark; }
    body {
      font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      margin: 0; padding: 16px; background: #111; color: #d4d4d4;
    }
    h1 {
      font-size: 18px; margin: 0 0 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    #lang-switch { display: inline-flex; font-size: 11px; font-weight: 400; }
    #lang-switch button { padding: 2px 8px; }
    #lang-switch button:first-child { border-start-end-radius: 0; border-end-end-radius: 0; }
    #lang-switch button:last-child { border-start-start-radius: 0; border-end-start-radius: 0; margin-inline-start: -1px; }
    #lang-switch button[aria-pressed="true"] { background: #333; color: #fff; }
    h2 { font-size: 14px; margin: 16px 0 6px; }
    label { display: block; margin: 10px 0 4px; color: #9a9a9a; }
    select, textarea, button {
      font: inherit; color: inherit; background: #1c1c1c;
      border: 1px solid #333; border-radius: 4px;
    }
    select, textarea { width: 100%; box-sizing: border-box; padding: 8px; }
    button { padding: 8px 16px; cursor: pointer; }
    #time { margin-left: 10px; color: #9a9a9a; }
    .err { color: #e07070; min-height: 1.2em; }
    table { width: 100%; border-collapse: collapse; background: #1c1c1c; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #333; }
    th { color: #9a9a9a; }
    pre {
      margin: 0; padding: 10px; background: #1c1c1c; border: 1px solid #333;
      border-radius: 4px; overflow: auto; white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>system one<span id="lang-switch">
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
    <button type="button" data-lang="ru" aria-pressed="false">RU</button>
  </span></h1>
  <label for="model" data-i18n="model">model</label>
  <select id="model"></select>
  <label for="state" data-i18n="state">state</label>
  <textarea id="state" rows="3">Database replication lag exceeded 45 seconds.</textarea>
  <label for="questions" data-i18n="questions">questions</label>
  <textarea id="questions" rows="16">{
  "intent": {
    "type": "choice",
    "instructions": "Classify the root cause domain.",
    "criteria": {
      "infrastructure": "Database, hardware, network, or server failures",
      "billing": "Invoices, payments, refunds"
    }
  },
  "is_urgent": {
    "type": "noul",
    "instructions": "Does this issue require immediate attention?"
  },
  "severity": {
    "type": "score",
    "instructions": "Rate the incident severity.",
    "criteria": ["Low", "Medium", "High"]
  }
}</textarea>
  <p>
    <button id="run" type="button" data-i18n="run">Run</button>
    <span id="time"></span>
  </p>
  <div id="error" class="err"></div>
  <h2 data-i18n="answers">answers</h2>
  <div id="out"></div>
  <h2 data-i18n="raw">raw response</h2>
  <pre id="raw"></pre>
  <script>
    const STRINGS = {
      "en": {
        "model": "model",
        "state": "state",
        "questions": "questions",
        "run": "Run",
        "answers": "answers",
        "raw": "raw response",
        "question": "question",
        "answer": "answer",
        "confidence": "confidence",
        "questionsError": "questions: ",
        "defaultState": "Database replication lag exceeded 45 seconds.",
        "defaultQuestions": "{\n  \"intent\": {\n    \"type\": \"choice\",\n    \"instructions\": \"Classify the root cause domain.\",\n    \"criteria\": {\n      \"infrastructure\": \"Database, hardware, network, or server failures\",\n      \"billing\": \"Invoices, payments, refunds\"\n    }\n  },\n  \"is_urgent\": {\n    \"type\": \"noul\",\n    \"instructions\": \"Does this issue require immediate attention?\"\n  },\n  \"severity\": {\n    \"type\": \"score\",\n    \"instructions\": \"Rate the incident severity.\",\n    \"criteria\": [\"Low\", \"Medium\", \"High\"]\n  }\n}"
      },
      "ru": {
        "model": "модель",
        "state": "состояние",
        "questions": "вопросы",
        "run": "Запустить",
        "answers": "ответы",
        "raw": "исходный ответ",
        "question": "вопрос",
        "answer": "ответ",
        "confidence": "уверенность",
        "questionsError": "вопросы: ",
        "defaultState": "Отставание репликации базы данных превысило 45 секунд.",
        "defaultQuestions": "{\n  \"намерение\": {\n    \"type\": \"choice\",\n    \"instructions\": \"Определи область первопричины.\",\n    \"criteria\": {\n      \"инфраструктура\": \"Сбои базы данных, оборудования, сети или серверов\",\n      \"биллинг\": \"Счета, платежи, возвраты\"\n    }\n  },\n  \"срочность\": {\n    \"type\": \"noul\",\n    \"instructions\": \"Требует ли проблема немедленного вмешательства?\"\n  },\n  \"серьёзность\": {\n    \"type\": \"score\",\n    \"instructions\": \"Оцени серьёзность инцидента.\",\n    \"criteria\": [\"Низкая\", \"Средняя\", \"Высокая\"]\n  }\n}"
      }
    };

    const modelEl = document.getElementById("model");
    const langBtns = document.querySelectorAll("#lang-switch button");
    const stateEl = document.getElementById("state");
    const questionsEl = document.getElementById("questions");
    const errEl = document.getElementById("error");
    const outEl = document.getElementById("out");
    const rawEl = document.getElementById("raw");
    const timeEl = document.getElementById("time");

    let lang = "en";
    let lastData = null;

    function t(key) {
      return STRINGS[lang][key];
    }

    function detectLang() {
      const tags = navigator.languages && navigator.languages.length
        ? navigator.languages
        : [navigator.language || ""];
      for (const tag of tags) {
        const code = String(tag).toLowerCase().split("-")[0];
        if (code === "ru") return "ru";
        if (code === "en") return "en";
      }
      return "en";
    }

    function storedLang() {
      try {
        const value = localStorage.getItem("systemone-lang");
        return value && STRINGS[value] ? value : null;
      } catch (err) {
        return null;
      }
    }

    function applyLang(next) {
      const prev = lang;
      lang = next;
      document.documentElement.lang = next;
      for (const el of document.querySelectorAll("[data-i18n]")) {
        el.textContent = t(el.dataset.i18n);
      }
      for (const btn of langBtns) {
        btn.setAttribute("aria-pressed", String(btn.dataset.lang === next));
      }
      if (stateEl.value === STRINGS[prev].defaultState) stateEl.value = t("defaultState");
      if (questionsEl.value === STRINGS[prev].defaultQuestions) questionsEl.value = t("defaultQuestions");
      if (lastData) render(lastData);
    }

    for (const btn of langBtns) {
      btn.onclick = () => {
        applyLang(btn.dataset.lang);
        try { localStorage.setItem("systemone-lang", btn.dataset.lang); } catch (err) {}
      };
    }

    function cell(text) {
      const td = document.createElement("td");
      td.textContent = text;
      return td;
    }

    function num(value, digits) {
      const x = Number(value);
      return Number.isFinite(x) ? x.toFixed(digits) : "";
    }

    function render(data) {
      lastData = data;
      outEl.replaceChildren();
      const table = document.createElement("table");
      const head = document.createElement("tr");
      for (const key of ["question", "answer", "confidence"]) {
        const th = document.createElement("th");
        th.textContent = t(key);
        head.appendChild(th);
      }
      table.appendChild(head);
      for (const [name, answer] of Object.entries(data.answers || {})) {
        let value = "";
        if (answer.type === "choice") value = String(answer.choice ?? "");
        else if (answer.type === "noul") value = num(answer.noul, 3);
        else if (answer.type === "score") value = num(answer.score, 3);
        else value = JSON.stringify(answer);
        const tr = document.createElement("tr");
        tr.appendChild(cell(name));
        tr.appendChild(cell(value));
        tr.appendChild(cell(answer.confidence == null ? "" : num(answer.confidence, 2)));
        table.appendChild(tr);
      }
      outEl.appendChild(table);
      rawEl.textContent = JSON.stringify(data, null, 2);
    }

    fetch("/v1/models").then((res) => res.json()).then((data) => {
      for (const model of data.models || []) {
        const option = document.createElement("option");
        option.value = model.name;
        option.textContent = model.name;
        modelEl.appendChild(option);
      }
    }).catch((err) => { errEl.textContent = String(err); });

    document.getElementById("run").onclick = async () => {
      errEl.textContent = "";
      outEl.replaceChildren();
      rawEl.textContent = "";
      timeEl.textContent = "";
      let questions;
      try { questions = JSON.parse(questionsEl.value); }
      catch (err) { errEl.textContent = t("questionsError") + err.message; return; }
      const rawState = stateEl.value.trim();
      let state;
      try { state = JSON.parse(rawState); }
      catch (err) { state = rawState; }
      const started = performance.now();
      try {
        const res = await fetch("/v1/systemone", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({model: modelEl.value, state, questions})
        });
        const text = await res.text();
        const total = Math.round(performance.now() - started);
        timeEl.textContent = total + " ms, HTTP " + res.status;
        if (!res.ok) {
          errEl.textContent = text; rawEl.textContent = text; return;
        }
        render(JSON.parse(text));
      } catch (err) {
        errEl.textContent = String(err);
      }
    };

    applyLang(storedLang() || detectLang());
  </script>
</body>
</html>
