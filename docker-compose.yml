# Локальная сборка target runtime. Прод и prerelease подключаются оверлеями.

name: system-one-rknn

services:
  system-one-rknn:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        BOARD: ${BOARD:-rk3588}
    image: system-one-rknn:${BOARD:-rk3588}
    container_name: system-one-rknn
    restart: unless-stopped
    environment:
      PORT: ${PORT:-8080}
      MODELS_DIR: /models
      SYSTEM_ONE_ENGINE: ${SYSTEM_ONE_ENGINE:-npu}
      MODELS: ${MODELS:-laya,kev}
      LAYA_REPO: ${LAYA_REPO:-ShiWarai/laya-multilingual-rknn}
      KEV_REPO: ${KEV_REPO:-ShiWarai/kev-0.8b-rknn}
    devices:
      - /dev/dri
      - /dev/dma_heap
      - /dev/mpp_service
      - /dev/rga
    volumes:
      - ${MODELS_DIR:-./models}:/models
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${PORT:-8080}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 600s
