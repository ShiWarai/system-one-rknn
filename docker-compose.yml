# Локальная сборка target runtime. Прод и prerelease подключаются оверлеями.

name: service-template

services:
  service-template:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: service-template:latest
    container_name: service-template
    restart: unless-stopped
    environment:
      PORT: ${PORT:-8080}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${PORT:-8080}/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
